# Config para desenvolvimento LOCAL: backend DSpace 7.6 rodando em
# http://localhost:8080/server contra o banco PostgreSQL do host
# (banco "dspace", credenciais dspace/dspace — base restaurada da UNESC).
#
# Como usar:
#   1. Subir o backend: docker compose -p dspace-local -f docker/docker-compose-local-db.yml up -d
#   2. Subir o frontend: ./scripts/start-dev.sh local
#
# O DSPACE_APP_CONFIG_PATH aceita um único arquivo, então este arquivo contém
# o `rest` local + uma CÓPIA do bloco `acessoAcademico` de
# config/acesso-academico-unesc.yml (fonte da verdade do cliente — se aquele
# arquivo mudar, atualize a cópia abaixo).

rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

acessoAcademico:
  itemPage:
    metadadosAdicionais:
      - campos: [ 'dc.contributor.advisor' ]
        label: 'Orientador'
      - campos: [ 'dc.contributor.other' ]
        label: 'Coorientador'
      - campos: [ 'dc.contributor.editor' ]
        label: 'Organizador'
      - campos: [ 'dc.contributor.coordinator' ]
        label: 'Coordenador'
    # A ordem das chaves abaixo define a ordem de exibição na página /full;
    # campos sem label ficam no fim, em ordem alfabética.
    labelsMetadados:
      dc.title: 'Título'
      dc.title.alternative: 'Outros títulos'
      dc.contributor.author: 'Autor'
      dc.contributor.advisor: 'Orientador'
      dc.contributor.other: 'Coorientador'
      dc.contributor.editor: 'Organizador'
      dc.contributor.coordinator: 'Coordenador'
      dc.date.issued: 'Data de publicação'
      dc.publisher: 'Editora'
      dc.description.abstract: 'Resumo / Abstract'
      dc.description: 'Descrição'
      dc.description.sponsorship: 'Agência de fomento'
      dc.subject: 'Palavras-chave'
      dc.identifier.citation: 'Citação'
      dc.relation.ispartofseries: 'Série/Relatório nº'
      dc.identifier: 'Identificadores'
      dc.identifier.uri: 'URI'
      dc.type: 'Tipo'
      dc.language.iso: 'Idioma'
      dc.coverage.spatial: 'Cobertura espacial'
      dc.date.created: 'Data de criação'
      # Campos de sistema (fora do submission-form) exibidos na página /full
      dc.date.accessioned: 'Data de depósito'
      dc.date.available: 'Data de disponibilização'
      dc.description.provenance: 'Proveniência'
      dspace.entity.type: 'Tipo de entidade'
      # Campos de entidades (Person, Project, OrgUnit, Journal...)
      person.familyName: 'Sobrenome'
      person.givenName: 'Nome'
      person.email: 'E-mail'
      person.identifier.orcid: 'ORCID'
      person.birthDate: 'Data de nascimento'
      person.identifier.staffid: 'Matrícula'
      person.jobTitle: 'Cargo'
      project.identifier.status: 'Situação'
      project.identifier.startdate: 'Data de início'
      project.identifier.expectedcompletion: 'Conclusão prevista'
      project.startDate: 'Data de início'
      project.endDate: 'Data de término'
      project.amount: 'Valor'
      project.amount.currency: 'Moeda'
      organization.legalName: 'Nome'
      organization.foundingDate: 'Data de fundação'
      organization.address.addressLocality: 'Cidade'
      organization.address.addressCountry: 'País'
      creativework.editor: 'Editor'
      creativeworkseries.issn: 'ISSN'
      creativework.publisher: 'Editora'
      publicationvolume.volumeNumber: 'Volume'
      creativework.datePublished: 'Data de publicação'
      publicationissue.issueNumber: 'Número'
      creativework.keywords: 'Palavras-chave'
